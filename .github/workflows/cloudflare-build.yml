name: Cloudflare Workers build

on:
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!README.md"
  push:
    branches:
      - feat/cloudflare-workers-migration

permissions:
  contents: read

concurrency:
  group: cloudflare-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Validate standalone Worker and D1 backend
        run: |
          node --check cloudflare/worker.js
          node --test scripts/d1-backend.test.mjs

      - name: Check TanStack app scaffold
        id: app
        shell: bash
        run: |
          if [[ -f src/router.tsx && -d src/routes ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "TanStack Start app entrypoints found."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare build skipped: this repository currently contains the App Builder workspace scaffold but no src/router.tsx or src/routes/. Add the actual JEE360 app before attempting a deploy."
          fi

      - name: Build for Cloudflare Workers
        if: steps.app.outputs.ready == 'true'
        run: npm run build:cloudflare

      - name: Verify Nitro Worker output
        if: steps.app.outputs.ready == 'true'
        run: |
          test -f .output/server/index.mjs
          test -f .output/server/wrangler.json

      - name: Explain deployment is not ready
        if: steps.app.outputs.ready != 'true'
        run: |
          echo "Dependencies installed successfully."
          echo "No Worker artifact was produced because the application entrypoints are not present."
          echo "This is an explicit scaffold check, not a successful application build."
